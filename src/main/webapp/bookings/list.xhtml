<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Bookings</title>
    <h:outputStylesheet name="css/styles.css"/>
</h:head>
<h:body>
    <div class="navbar">
        <span class="brand">Study Room Booking</span>
        <h:link outputText="Home" value="/index.xhtml"/>
        <h:link outputText="Study Rooms" value="/rooms/list.xhtml"/>
        <h:link outputText="Bookings" value="/bookings/list.xhtml"/>
    </div>

    <div class="container">
        <h1 class="page-title">Bookings</h1>
        <p class="page-subtitle">Create, view, edit and delete bookings (CRUD entity 2 of 2).</p>

        <h:form id="bookingListForm">
            <h:messages globalOnly="true" style="color:#166534;" layout="table"/>

            <div class="card">
                <h:commandLink value="+ New Booking" action="#{bookingBean.prepareNew}"
                                styleClass="btn btn-primary"/>

                <table class="data-table" style="margin-top:16px;">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Student</th>
                        <th>Room</th>
                        <th>Purpose</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <ui:repeat var="booking" value="#{bookingBean.bookings}">
                        <tr>
                            <td><h:outputText value="#{booking.bookingDate}"/></td>
                            <td><h:outputText value="#{booking.startTime}"/> - <h:outputText value="#{booking.endTime}"/></td>
                            <td>#{booking.student.fullName}</td>
                            <td>#{booking.studyRoom.roomNumber}</td>
                            <td>#{booking.purpose}</td>
                            <td>
                                <span class="badge badge-#{booking.status == 'CONFIRMED' ? 'confirmed' : (booking.status == 'PENDING' ? 'pending' : (booking.status == 'CANCELLED' ? 'cancelled' : 'completed'))}">
                                    #{booking.status}
                                </span>
                            </td>
                            <td>
                                <h:commandLink value="Edit" action="#{bookingBean.prepareEdit(booking.id)}"/>
                                &#160;|&#160;
                                <h:commandLink value="Delete" action="#{bookingBean.delete(booking.id)}"
                                               style="color:#dc2626;">
                                    <f:ajax render=":bookingListForm"/>
                                </h:commandLink>
                            </td>
                        </tr>
                    </ui:repeat>
                    </tbody>
                </table>
            </div>
        </h:form>
    </div>
</h:body>
</html>
